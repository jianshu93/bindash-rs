[package]
name = "bindash"
version = "0.1.3"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "One Permutation Hashing, Optimal Densification, Genomics"
autobins = false


[[bin]]
name = "bindash"
path = "src/bin/bindash_cpu.rs"

[[bin]]

name = "bindash-cuda"
path = "src/bin/bindash_cuda.rs"
required-features = ["cuda"]

[[bin]]
name = "bindash-metal"
path = "src/bin/bindash_metal.rs"
required-features = ["metal"]

[dependencies]
zstd = { version = "0.13", features = ["zstdmt"] }
ryu = "1.0"
clap = "4.3"
needletail = "0.6.0"
rayon = "1.5"
# kmerutils = { version = "0.0.14", features = ["stdsimd"]}
kmerutils = { git = "https://github.com/jianshu93/kmerutils", features = ["stdsimd"]}
# anndists = { version = "0.1.3", features = ["stdsimd"] }
anndists = { git = "https://github.com/jianshu93/anndists", features = ["stdsimd"] }
num = { version = "0.4" }
num_cpus = "1"
log = "0.4"
anyhow = "1"
env_logger = { version = "0.11" }
cudarc = { version = "0.18.1", features = [
    "driver",
    "nvrtc",
    "cuda-version-from-build-system"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33", optional = true }

[features]
default = []
cuda = ["dep:cudarc"]
metal = ["dep:metal"]
